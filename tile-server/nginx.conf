# Static PMTiles server. PMTiles clients read single byte ranges of one big file,
# so what matters is: Range requests (nginx does this for static files), CORS for
# any origin (including the Range header and the headers the client must read back),
# and no gzip (it would change the byte offsets).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    sendfile on;
    tcp_nopush on;
    gzip off;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /tiles/ {
        # CORS (also on error responses, so the browser shows the real status).
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Access-Control-Max-Age "86400" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # A week file never changes once built; clients revalidate by ETag.
        etag on;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=3600" always;
        # add_header in this block drops the inherited ones, so CORS is repeated above.

        autoindex on; # a browsable list of the available weeks
        types { }
        default_type application/octet-stream;
    }
}
