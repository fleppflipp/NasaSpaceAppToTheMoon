# Static PMTiles server. PMTiles clients read single byte ranges of one big file,
# so what matters is: Range requests (nginx does this for static files), CORS for
# any origin (including the Range header and the headers the client must read back),
# and no gzip (it would change the byte offsets).
# The folder listing (/tiles/) must never be cached: the app reads it to find the months
# that have tiles. The observed month files never change once built. The forecast files
# (forecast_*) are rebuilt with every new forecast, so the browser must revalidate them
# (ETag, a cheap 304 when unchanged): a cached header of an old file would point the
# client at wrong byte ranges of the new one, and the map would keep showing old dots.
map $uri $tile_cache_control {
    default              "public, max-age=3600";
    "~/$"                "no-cache";
    "~/forecast_[^/]*$"  "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    sendfile on;
    tcp_nopush on;
    gzip off;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /tiles/ {
        # CORS (also on error responses, so the browser shows the real status).
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Access-Control-Max-Age "86400" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # A month file never changes once built; clients revalidate by ETag.
        etag on;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control $tile_cache_control always;
        # add_header in this block drops the inherited ones, so CORS is repeated above.

        autoindex on;
        autoindex_format json; # the app lists the available months from this
        types { }
        default_type application/octet-stream;
    }
}
